name: Activate Siren CI

on:
  push:
    branches: ["main"]
    paths:
      - "projects/activate-siren/**"
      - "netlify.toml"
      - ".github/workflows/activate-siren-ci.yml"
  pull_request:
    paths:
      - "projects/activate-siren/**"
      - "netlify.toml"
      - ".github/workflows/activate-siren-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/activate-siren
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Install pinned dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Check Netlify Function syntax
        run: npm run check

      - name: Run safety contract tests
        run: npm test

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: projects/activate-siren
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Install pinned dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit

      - name: Run Chromium/WebKit browser smoke tests
        run: npm run test:browser
