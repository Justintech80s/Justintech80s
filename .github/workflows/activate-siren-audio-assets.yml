name: Generate Activate Siren iOS Audio

on:
  push:
    branches: ["main"]
    paths:
      - "projects/activate-siren/scripts/generate_ios_audio.py"
      - ".github/workflows/activate-siren-audio-assets.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Generate AAC/M4A and MP3 alarm files
        run: python3 projects/activate-siren/scripts/generate_ios_audio.py

      - name: Commit generated audio assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/activate-siren/audio/*-ios-v3.m4a projects/activate-siren/audio/*-fallback-v3.mp3
          if git diff --cached --quiet; then
            echo "Audio assets already current."
            exit 0
          fi
          git commit -m "Generate iOS-compatible siren audio assets"
          git push
